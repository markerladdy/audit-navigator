<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c4a6e"/>
      <stop offset="100%" style="stop-color:#0ea5e9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
  </defs>

  <!-- 背景圆 -->
  <circle cx="50" cy="60" r="42" fill="url(#logoGrad)"/>

  <!-- 十字 + 书简 组合图标 -->
  <!-- 十字（医院） -->
  <rect x="42" y="34" width="16" height="4" rx="2" fill="white"/>
  <rect x="48" y="28" width="4" height="16" rx="2" fill="white"/>

  <!-- 书/页（教育） -->
  <path d="M34 72 Q50 78 66 72" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M34 64 Q50 70 66 64" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- AI 标识 -->
  <text x="50" y="84" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#7dd3fc">AI</text>

  <!-- 品牌名 -->
  <text x="115" y="52" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="700" fill="#0c4a6e">医教财通</text>

  <!-- 英文副标题 -->
  <text x="115" y="74" font-family="sans-serif" font-size="11" fill="#64748b" font-weight="500">Medical · Education · Finance</text>

  <!-- 标语 -->
  <rect x="115" y="82" rx="3" width="180" height="20" fill="#f0f9ff"/>
  <text x="120" y="96" font-family="sans-serif" font-size="11" fill="#0ea5e9" font-weight="500">AI+财务管理软件应用平台</text>

  <!-- 装饰点 -->
  <circle cx="240" cy="52" r="2" fill="#2563eb" opacity="0.3"/>
  <circle cx="248" cy="52" r="2" fill="#059669" opacity="0.3"/>
  <circle cx="256" cy="52" r="2" fill="#d97706" opacity="0.3"/>
</svg>
