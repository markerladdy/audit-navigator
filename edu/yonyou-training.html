<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用友设计制造一体化解决方案 — 在线演示</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .top-bar {
      background: #0f172a;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .top-bar h1 {
      font-size: 16px;
      font-weight: 600;
      color: #f1f5f9;
    }
    .top-bar .actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .top-bar .actions a, .top-bar .actions button {
      padding: 6px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-download {
      background: #2563eb;
      color: white;
      border: none;
    }
    .btn-download:hover { background: #1d4ed8; }
    .btn-back {
      background: #334155;
      color: #e2e8f0;
      border: none;
    }
    .btn-back:hover { background: #475569; }
    .iframe-wrapper {
      flex: 1;
      position: relative;
      width: 100%;
    }
    .iframe-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #94a3b8;
      font-size: 15px;
      text-align: center;
    }
    @media (max-width: 768px) {
      .top-bar { flex-wrap: wrap; gap: 8px; }
      .top-bar h1 { font-size: 14px; }
    }
  </style>
</head>
<body>

<div class="top-bar">
  <h1>📊 用友设计制造一体化解决方案</h1>
  <div class="actions">
    <a href="../education.html#yonyou" class="btn-back">← 返回</a>
    <a href="../downloads/用友高校实训-智能制造.pptx" class="btn-download">⬇ 下载PPT</a>
  </div>
</div>

<div class="iframe-wrapper">
  <div class="loading">正在加载 Office 在线查看器...</div>
  <iframe
    src="https://view.officeapps.live.com/op/embed.aspx?src=https://auditnavigator.de5.net/downloads/%E7%94%A8%E5%8F%8B%E9%AB%98%E6%A0%A1%E5%AE%9E%E8%AE%AD-%E6%99%BA%E8%83%BD%E5%88%B6%E9%80%A0.pptx"
    allowfullscreen
    onload="document.querySelector('.loading').style.display='none'"
  ></iframe>
</div>

</body>
</html>
